name: Publish latest Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-latest-release
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle wrapper is executable
        working-directory: android
        run: chmod +x gradlew

      - name: Build installable APK
        working-directory: android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          APP_VERSION: 0.1.${{ github.run_number }}
        run: ./gradlew assembleDebug

      - name: Prepare stable download
        run: cp android/app/build/outputs/apk/debug/app-debug.apk zysham-latest.apk

      - name: Publish permanent latest release
        uses: ncipollo/release-action@v1
        with:
          tag: android-latest
          name: Latest Zysham Android APK
          body: This APK is rebuilt automatically from the latest published Zysham source.
          artifacts: zysham-latest.apk
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
